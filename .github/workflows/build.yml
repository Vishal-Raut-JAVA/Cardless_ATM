name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android --org com.demo --project-name cardless_atm .

      - name: Patch Android settings
        run: |
          M=android/app/src/main/AndroidManifest.xml

          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application#' "$M"

          sed -i 's/android:label="[^"]*"/android:label="Cardless ATM"/' "$M"

          K=$(find android/app/src/main -name 'MainActivity.*' | head -n 1)
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$K"

          # REQUIRED FIX: local_auth's fingerprint prompt needs the activity to use
          # an AppCompat-derived theme once MainActivity extends FlutterFragmentActivity.
          # Without this, the app crashes at the fingerprint step with:
          # "You need to use a Theme.AppCompat theme (or descendant) with this activity."
          for f in android/app/src/main/res/values*/styles.xml; do
            [ -f "$f" ] || continue
            sed -i 's/Theme\.Light\.NoTitleBar/Theme.AppCompat.Light.NoActionBar/g; s/Theme\.Black\.NoTitleBar/Theme.AppCompat.NoActionBar/g' "$f"
          done

          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle*

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: cardless-atm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
