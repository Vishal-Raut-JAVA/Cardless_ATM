name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android --org com.demo --project-name cardless_atm .

      - name: Patch Android settings
        run: |
          set -e
          M=android/app/src/main/AndroidManifest.xml

          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <uses-permission android:name="android.permission.SEND_SMS"/>\n    <uses-feature android:name="android.hardware.telephony" android:required="false"/>\n    <application#' "$M"

          sed -i 's/android:label="[^"]*"/android:label="Cardless ATM"/' "$M"

          # Overwrite MainActivity completely with a known-good version:
          # extends FlutterFragmentActivity (required by local_auth's fingerprint
          # prompt) AND exposes a small native SMS-sending channel, built only
          # on Android's own SmsManager - no third-party SMS package involved.
          K=$(find android/app/src/main -name 'MainActivity.*' | head -n 1)
          cat > "$K" <<'KOTLIN'
          package com.demo.cardless_atm

          import android.telephony.SmsManager
          import io.flutter.embedding.android.FlutterFragmentActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterFragmentActivity() {
              private val CHANNEL = "cardless_atm/sms"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                      .setMethodCallHandler { call, result ->
                          if (call.method == "sendSms") {
                              val phone = call.argument<String>("phone")
                              val message = call.argument<String>("message")
                              if (phone.isNullOrBlank() || message.isNullOrBlank()) {
                                  result.error("BAD_ARGS", "Phone or message missing", null)
                                  return@setMethodCallHandler
                              }
                              try {
                                  val smsManager = SmsManager.getDefault()
                                  val parts = smsManager.divideMessage(message)
                                  if (parts.size > 1) {
                                      smsManager.sendMultipartTextMessage(phone, null, parts, null, null)
                                  } else {
                                      smsManager.sendTextMessage(phone, null, message, null, null)
                                  }
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error("SEND_FAILED", e.message ?: "Unknown error sending SMS", null)
                              }
                          } else {
                              result.notImplemented()
                          }
                      }
              }
          }
          KOTLIN

          # REQUIRED FIX (from last build): AppCompat themes live under "@style/",
          # NOT "android:style/".
          for f in android/app/src/main/res/values*/styles.xml; do
            [ -f "$f" ] || continue
            sed -i \
              -e 's#android:style/Theme\.Light\.NoTitleBar#@style/Theme.AppCompat.Light.NoActionBar#g' \
              -e 's#android:style/Theme\.Black\.NoTitleBar#@style/Theme.AppCompat.NoActionBar#g' \
              -e 's#@android:style/Theme\.Light\.NoTitleBar#@style/Theme.AppCompat.Light.NoActionBar#g' \
              -e 's#@android:style/Theme\.Black\.NoTitleBar#@style/Theme.AppCompat.NoActionBar#g' \
              "$f"
          done

          # Safety net proguard rules (inert unless minification is ever turned on).
          mkdir -p android/app
          cat >> android/app/proguard-rules.pro <<'PGEOF'
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_face_detection.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_common.** { *; }
          -dontwarn com.google.mlkit.**
          PGEOF

          # minSdk 24 (required by local_auth/camera), and compileSdk 35
          # (required by google_mlkit_face_detection 0.13+) - pinned explicitly
          # so a Flutter template default can't silently fall short again.
          sed -i \
            -e 's/minSdk = flutter.minSdkVersion/minSdk = 24/' \
            -e 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' \
            -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' \
            -e 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' \
            android/app/build.gradle*

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: cardless-atm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
