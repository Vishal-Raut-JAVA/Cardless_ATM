name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android --org com.demo --project-name cardless_atm .

      - name: Patch Android settings
        run: |
          M=android/app/src/main/AndroidManifest.xml

          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application#' "$M"

          sed -i 's/android:label="[^"]*"/android:label="Cardless ATM"/' "$M"

          K=$(find android/app/src/main -name 'MainActivity.*' | head -n 1)
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$K"

          # REQUIRED FIX: local_auth's fingerprint prompt needs the activity to use
          # an AppCompat theme once MainActivity extends FlutterFragmentActivity.
          # FIX (previous bug): AppCompat themes live under "@style/", NOT
          # "android:style/". The old sed kept the "android:" prefix, producing
          # the invalid "android:style/Theme.AppCompat..." which AAPT rejected.
          for f in android/app/src/main/res/values*/styles.xml; do
            [ -f "$f" ] || continue
            sed -i \
              -e 's#android:style/Theme\.Light\.NoTitleBar#@style/Theme.AppCompat.Light.NoActionBar#g' \
              -e 's#android:style/Theme\.Black\.NoTitleBar#@style/Theme.AppCompat.NoActionBar#g' \
              -e 's#@android:style/Theme\.Light\.NoTitleBar#@style/Theme.AppCompat.Light.NoActionBar#g' \
              -e 's#@android:style/Theme\.Black\.NoTitleBar#@style/Theme.AppCompat.NoActionBar#g' \
              "$f"
          done

          # Make sure the AppCompat library is actually available to link against.
          G=android/app/build.gradle
          [ -f "$G" ] || G=android/app/build.gradle.kts
          if ! grep -q "androidx.appcompat:appcompat" "$G"; then
            if [ "$G" = "android/app/build.gradle" ]; then
              sed -i "/dependencies {/a\\    implementation 'androidx.appcompat:appcompat:1.6.1'" "$G"
            else
              sed -i '/dependencies {/a\    implementation("androidx.appcompat:appcompat:1.6.1")' "$G"
            fi
          fi

          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle*

          # Safety net: keep ML Kit's internal classes intact in case anything
          # gets stripped/renamed during the release build. This does not
          # change your app's behaviour if this wasn't the cause of the crash.
          mkdir -p android/app
          cat >> android/app/proguard-rules.pro <<'PGEOF'
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_face_detection.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_common.** { *; }
          -dontwarn com.google.mlkit.**
          PGEOF

          # NOTE: we do NOT force minifyEnabled on here. This project builds
          # with minification off by default, which is safer for a demo -
          # the proguard-rules.pro file above only matters if minification
          # is ever turned on later, and does nothing while it's off.

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: cardless-atm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
